name: Python package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['[0-9]*']

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v

  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ github.ref_type == 'tag' && '0' || '1' }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify release tag
        if: github.ref_type == 'tag'
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python - <<'PY'
          import os
          import re
          import runpy

          tag = os.environ["GITHUB_REF_NAME"]
          version = runpy.run_path("UsableFunctions/_metadata.py")["__version__"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", tag) or tag != version:
              raise SystemExit(f"Release tag {tag!r} must match the package version {version!r} (X.Y.Z)")
          PY
      - run: python -m pip install build twine ruff
      - run: ruff check --select F UsableFunctions tests
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test the installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          python -m pip check
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish verified distributions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(dist/*.whl dist/*.tar.gz)
          if release=$(gh release view "$GITHUB_REF_NAME" --json isDraft,assets); then
            if jq -e '.isDraft' <<< "$release" > /dev/null; then
              gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
              gh release edit "$GITHUB_REF_NAME" --draft=false
            else
              for asset in "${assets[@]}"; do
                jq -e --arg name "${asset##*/}" 'any(.assets[]; .name == $name)' \
                  <<< "$release" > /dev/null
              done
              echo "Release already contains both distributions."
            fi
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag --title "UsableFunctions $GITHUB_REF_NAME" --generate-notes
          fi
