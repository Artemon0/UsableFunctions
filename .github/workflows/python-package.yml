name: Python Package CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

concurrency:
  group: python-package-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Test import
        run: |
          python -c "from UsableFunctions import UsableFunctions; uf = UsableFunctions(); print('[OK] Import successful'); print('Calculator test: 5 + 7 = ' + str(uf.calculator(5, 7, '+')))"


  release:
    name: Build and Release
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Calculate next version
        id: version
        shell: bash
        run: |
          git fetch --tags --force

          latest_tag=$(git tag --list 'v1.7.*' --sort=-version:refname | head -n 1)

          if [ -z "$latest_tag" ]; then
            version="1.7.0"
          else
            latest_version="${latest_tag#v}"
            patch=$(echo "$latest_version" | cut -d. -f3)
            next_patch=$((patch + 1))
            version="1.7.${next_patch}"
          fi

          echo "Latest tag: ${latest_tag:-none}"
          echo "New version: $version"

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set package version
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["PACKAGE_VERSION"]

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")

          pattern = r'(?m)^version\s*=\s*"[^"]+"$'

          new_text, count = re.subn(
              pattern,
              f'version = "{version}"',
              text,
              count=1
          )

          if count != 1:
              raise RuntimeError(
                  "Could not find project version in pyproject.toml"
              )

          path.write_text(new_text, encoding="utf-8")

          print(f"Package version set to {version}")
          PY

      - name: Verify package version
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          expected = os.environ["PACKAGE_VERSION"]

          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)

          actual = data["project"]["version"]

          if actual != expected:
              raise RuntimeError(
                  f"Version mismatch: expected {expected}, got {actual}"
              )

          print(f"[OK] Package version: {actual}")
          PY

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade build twine

      - name: Clean build directories
        run: |
          rm -rf build
          rm -rf dist
          rm -rf ./*.egg-info

      - name: Build package
        run: |
          python -m build

          echo "Built packages:"
          ls -lah dist/

      - name: Check package
        run: |
          twine check dist/*

      - name: Verify built packages
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["PACKAGE_VERSION"]

          expected_wheel = f"UsableFunctions-{version}-py3-none-any.whl"
          expected_sdist = f"UsableFunctions-{version}.tar.gz"

          files = {file.name for file in Path("dist").iterdir()}

          print("Built files:")
          for file in sorted(files):
              print(f"  {file}")

          if expected_wheel not in files:
              raise RuntimeError(
                  f"Missing wheel: {expected_wheel}"
              )

          if expected_sdist not in files:
              raise RuntimeError(
                  f"Missing source distribution: {expected_sdist}"
              )

          print("[OK] Wheel found")
          print("[OK] Source distribution found")
          PY

      - name: Create Git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: UsableFunctions v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz